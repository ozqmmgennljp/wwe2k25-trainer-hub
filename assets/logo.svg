<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="0" width="4" height="1" fill="#e8ecf1" opacity="0.06"/>
    </pattern>
    <clipPath id="beltClip">
      <polygon points="128,18 236,84 236,172 128,238 20,172 20,84"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="#0b0e14"/>

  <!-- Subtle grid texture -->
  <g opacity="0.08" stroke="#39ff88" stroke-width="0.5">
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
  </g>

  <!-- Championship belt plate (hexagonal, off-center top-left) -->
  <g transform="translate(-6,-4)">
    <!-- Outer plate border -->
    <polygon points="128,26 224,86 224,162 128,222 32,162 32,86"
             fill="#0b0e14" stroke="#c8102e" stroke-width="5"/>
    <!-- Inner plate -->
    <polygon points="128,40 210,92 210,156 128,208 46,156 46,92"
             fill="#0b0e14" stroke="#e8ecf1" stroke-width="2" opacity="0.9"/>

    <!-- Belt strap ends (left and right) -->
    <rect x="10" y="108" width="28" height="36" fill="#c8102e" opacity="0.85"/>
    <rect x="218" y="108" width="28" height="36" fill="#c8102e" opacity="0.85"/>
    <line x1="10" y1="118" x2="38" y2="118" stroke="#0b0e14" stroke-width="2"/>
    <line x1="10" y1="126" x2="38" y2="126" stroke="#0b0e14" stroke-width="2"/>
    <line x1="10" y1="134" x2="38" y2="134" stroke="#0b0e14" stroke-width="2"/>
    <line x1="218" y1="118" x2="246" y2="118" stroke="#0b0e14" stroke-width="2"/>
    <line x1="218" y1="126" x2="246" y2="126" stroke="#0b0e14" stroke-width="2"/>
    <line x1="218" y1="134" x2="246" y2="134" stroke="#0b0e14" stroke-width="2"/>

    <!-- Center diamond emblem -->
    <polygon points="128,68 172,124 128,180 84,124" fill="#0b0e14" stroke="#39ff88" stroke-width="3"/>
    <polygon points="128,84 158,124 128,164 98,124" fill="none" stroke="#39ff88" stroke-width="1.5" opacity="0.6"/>

    <!-- Crossed wrench and chevron-sword -->
    <!-- Wrench (diagonal from bottom-left to top-right) -->
    <g>
      <rect x="66" y="118" width="12" height="64" transform="rotate(-45 72 150)" fill="#e8ecf1"/>
      <circle cx="68" cy="112" r="10" fill="none" stroke="#e8ecf1" stroke-width="5"/>
      <rect x="60" y="104" width="16" height="10" fill="#e8ecf1"/>
    </g>

    <!-- Chevron-sword (diagonal from bottom-right to top-left) -->
    <g>
      <polygon points="162,96 168,96 148,164 142,164" fill="#e8ecf1"/>
      <!-- Chevron head -->
      <polygon points="172,88 160,74 148,88 156,88 148,100 160,86 172,100"
               fill="#39ff88" transform="translate(-4,-4)"/>
      <!-- Grip -->
      <rect x="146" y="152" width="12" height="16" fill="#c8102e" transform="rotate(-45 152 160)"/>
    </g>

    <!-- Cross point accent -->
    <circle cx="128" cy="124" r="6" fill="#c8102e"/>
    <circle cx="128" cy="124" r="3" fill="#39ff88"/>

    <!-- Bottom terminal bar detail -->
    <polyline points="100,192 128,208 156,192" fill="none" stroke="#c8102e" stroke-width="2.5"/>
    <rect x="118" y="198" width="20" height="4" fill="#c8102e"/>
  </g>

  <!-- Scanline overlay on mark -->
  <polygon points="122,22 218,82 218,158 122,218 26,158 26,82" fill="url(#scan)" opacity="0.5"/>

  <!-- Corner tech brackets (terminal aesthetic) -->
  <g stroke="#39ff88" stroke-width="2" fill="none" opacity="0.7">
    <polyline points="14,40 14,14 40,14"/>
    <polyline points="216,14 242,14 242,40"/>
    <polyline points="242,216 242,242 216,242"/>
    <polyline points="40,242 14,242 14,216"/>
  </g>

  <!-- Small wordmark bottom-right -->
  <g font-family="monospace" fill="#e8ecf1" opacity="0.55">
    <text x="170" y="246" font-size="7" letter-spacing="1.2">WWE2K25-TRAINER-HUB</text>
  </g>

  <!-- Small accent ticks -->
  <rect x="122" y="244" width="2" height="4" fill="#c8102e"/>
  <rect x="126" y="244" width="2" height="4" fill="#39ff88"/>
</svg>
